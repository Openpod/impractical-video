name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Configure Electron for Linux tests
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run --auto-servernum npm run check
      - run: npm audit --audit-level=high
      - run: npm run release:scan
      - name: Verify agent guide link
        run: test "$(readlink CLAUDE.md)" = AGENTS.md
      - run: npm run test:smoke
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run setup
      - run: npm run build
      - run: npm run release:source
      - name: Verify exported agent guides
        run: test ! -L dist/source/video-fs/CLAUDE.md && cmp AGENTS.md dist/source/video-fs/CLAUDE.md
      - uses: actions/upload-artifact@v4
        with:
          name: video-fs-source
          path: dist/source/video-fs
          include-hidden-files: true
